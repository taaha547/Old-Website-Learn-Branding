title: learnbranding.me
description: "Evidence-based branding education, built from zero and shown working."
author: "Taaha Zaidi"

# --- Content model ---
# Every chapter of the roadmap lives in /_articles/ as one Markdown file.
# You never touch the HTML/Tailwind again after this is set up — you only
# write front matter (the fields between the --- lines) and Markdown body text.
collections:
  articles:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article

markdown: kramdown
kramdown:
  input: GFM        # lets you write plain Markdown tables, like a Word doc
  auto_ids: true     # every ## heading gets an id automatically (powers the auto-TOC)
  syntax_highlighter: rouge

# Files/folders Jekyll should ignore when building
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
