<!--
  Usage inside any article's Markdown body:
  {% include components/stat-card.html label="Category Growth" value="24%" caption="Year-over-year, per Kantar tracking" color="primary" %}
  color can be: primary | tertiary | on-surface (defaults to primary)
-->
<div class="bg-surface-container-low p-space-md rounded-xl">
  <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">{{ include.label }}</span>
  <div class="font-headline-md text-headline-md font-bold text-{{ include.color | default: "primary" }} mt-1">{{ include.value }}</div>
  <p class="font-caption text-caption text-on-surface-variant mt-1">{{ include.caption }}</p>
</div>
